name: Lumen Desktop

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Desktop version in pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node apps/desktop/scripts/check-version-bump.mjs $env:BASE_SHA
      - name: Check Desktop version on master
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node apps/desktop/scripts/check-version-bump.mjs $env:BASE_SHA
      - name: Install web dependencies
        run: npm ci
      - name: Verify web
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify desktop
        working-directory: apps/desktop
        run: npm run typecheck && npm test && npm run build
      - name: Build application audio helper
        run: |
          cmake -S apps/desktop/native -B apps/desktop/native/build -A x64
          cmake --build apps/desktop/native/build --config Release
      - name: Check whether a Desktop release is needed
        if: github.event_name == 'push'
        id: desktop_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'apps/desktop/package.json' | ConvertFrom-Json).version
          node apps/desktop/scripts/check-version.mjs "v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Versão do Desktop inválida.' }
          $releases = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar releases existentes.' }
          $existing = $releases | Where-Object { $_.tagName -eq "v$version" } | Select-Object -First 1
          if ($null -ne $existing -and -not $existing.isDraft) {
            "needed=false" >> $env:GITHUB_OUTPUT
          } else {
            "needed=true" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package Windows installer
        if: steps.desktop_release.outputs.needed == 'true'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never
      - name: Package standalone ZIP
        if: steps.desktop_release.outputs.needed == 'true'
        working-directory: apps/desktop
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = (Resolve-Path -LiteralPath 'release/win-unpacked').Path
          $portable = Join-Path (Resolve-Path -LiteralPath 'release').Path 'Lumen Desktop'
          Copy-Item -LiteralPath $source -Destination $portable -Recurse
          $zip = Join-Path (Resolve-Path -LiteralPath 'release').Path "Lumen-Desktop-$version-Standalone.zip"
          Compress-Archive -LiteralPath $portable -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path -LiteralPath 'release').Path "Lumen-Desktop-$version-Standalone.sha256"), "$hash  Lumen-Desktop-$version-Standalone.zip")
      - name: Sign update manifest
        if: steps.desktop_release.outputs.needed == 'true'
        working-directory: apps/desktop
        env:
          LUMEN_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LUMEN_UPDATE_PRIVATE_KEY_B64 }}
        run: node scripts/sign-release.mjs
      - name: Publish Desktop release
        if: steps.desktop_release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.desktop_release.outputs.version }}
        run: |
          $installer = (Get-ChildItem -LiteralPath 'apps/desktop/release' -Filter 'Lumen-Desktop-*-Setup.exe' | Select-Object -First 1).FullName
          $tag = "v$env:RELEASE_VERSION"
          $standalone = "apps/desktop/release/Lumen-Desktop-$env:RELEASE_VERSION-Standalone.zip"
          $checksum = "apps/desktop/release/Lumen-Desktop-$env:RELEASE_VERSION-Standalone.sha256"
          $assets = @($installer, $standalone, $checksum, 'apps/desktop/release/lumen-update.json', 'apps/desktop/release/lumen-update.sig')
          $releases = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar releases existentes.' }
          $existing = $releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1
          if ($null -ne $existing) {
            if (-not $existing.isDraft) { throw 'A release já foi publicada por outro processo.' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --generate-notes --title "Lumen Desktop $tag"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao anexar arquivos à release do Desktop.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release do Desktop.' }
