name: Lumen Desktop

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Verify web
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify desktop
        working-directory: apps/desktop
        run: npm run typecheck && npm test && npm run build
      - name: Build application audio helper
        run: |
          cmake -S apps/desktop/native -B apps/desktop/native/build -A x64
          cmake --build apps/desktop/native/build --config Release
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/desktop/scripts/check-version.mjs $env:RELEASE_TAG
      - name: Package Windows installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never
      - name: Sign update manifest
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        env:
          LUMEN_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LUMEN_UPDATE_PRIVATE_KEY_B64 }}
        run: node scripts/sign-release.mjs
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = (Get-ChildItem -LiteralPath 'apps/desktop/release' -Filter 'Lumen-Desktop-*-Setup.exe' | Select-Object -First 1).FullName
          gh release create $env:RELEASE_TAG $installer --draft --generate-notes --title "Lumen Desktop $env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG apps/desktop/release/lumen-update.json apps/desktop/release/lumen-update.sig
